name: Troca mensal do logo

on:
  schedule:
    - cron: "5 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  troca-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Copiar o logo do mes
        run: |
          MES=$(TZ=America/Sao_Paulo date +%m)
          ARQUIVO=$(ls logo-${MES}-*.png | head -n 1)
          echo "Mes: $MES | Arquivo: $ARQUIVO"
          cp "$ARQUIVO" logo-mhk.png
          echo "Ultima troca: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') - $ARQUIVO" > ultima-troca.txt

      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add logo-mhk.png ultima-troca.txt
          git commit -m "Logo do mes: $(cat ultima-troca.txt)"
          git push

      - name: Pedir atualizacao do site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
